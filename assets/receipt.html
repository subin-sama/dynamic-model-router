<section id="${root_id}" class="dmr-receipt" data-status="${status}" role="group" aria-label="${accessible_label}">
  <style>
    #${root_id} {
      --dmr-surface: var(--card, var(--color-token-background, light-dark(#ffffff, #1c1e22)));
      --dmr-text: var(--card-foreground, var(--foreground, var(--color-token-foreground, light-dark(#22252b, #edf0f5))));
      --dmr-muted: var(--muted-foreground, light-dark(#626873, #a4acb9));
      --dmr-border: var(--border, light-dark(#e1e5eb, #353b45));
      --dmr-accent: var(--${color}, light-dark(${light_color}, ${dark_color}));
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      overflow-wrap: anywhere;
      padding: 16px 18px;
      color: var(--dmr-text);
      background: var(--dmr-surface);
      border: 1px solid var(--dmr-border);
      border-inline-start: 3px solid var(--dmr-accent);
      border-radius: 14px;
      font-family: inherit;
      font-size: var(--font-size-base, 14px);
      line-height: 1.5;
      color-scheme: light dark;
      animation: ${root_id}-arrive 260ms cubic-bezier(.2,.7,.3,1) both;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    #${root_id}, #${root_id} * { box-sizing: border-box; }
    #${root_id} p, #${root_id} dl, #${root_id} dt, #${root_id} dd { margin: 0; }
    #${root_id} .dmr-heading, #${root_id} .dmr-brand {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    #${root_id} .dmr-heading { justify-content: space-between; gap: 10px 16px; }
    #${root_id} .dmr-brand strong { font-weight: 500; min-width: 0; max-width: 100%; }
    #${root_id} .dmr-dot {
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dmr-accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--dmr-accent) 12%, transparent);
    }
    #${root_id} .dmr-scope { color: var(--dmr-muted); overflow-wrap: anywhere; }
    #${root_id} .dmr-badge {
      display: inline-flex;
      max-width: 100%;
      padding: 3px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--dmr-accent) 13%, var(--dmr-surface));
      color: var(--dmr-text);
      overflow-wrap: anywhere;
    }
    #${root_id} .dmr-values {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(80px, .3fr);
      gap: 12px 22px;
      margin-top: 16px;
    }
    #${root_id} .dmr-values > div { min-width: 0; }
    #${root_id} dt, #${root_id} .dmr-evidence-label, #${root_id} .dmr-snapshot { color: var(--dmr-muted); }
    #${root_id} dd { margin-top: 3px; overflow-wrap: anywhere; }
    #${root_id} code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1em; color: inherit; background: none; white-space: normal; overflow-wrap: anywhere; }
    #${root_id} .dmr-reason { margin-top: 13px; overflow-wrap: anywhere; }
    #${root_id} .dmr-evidence { margin-top: 10px; overflow-wrap: anywhere; }
    #${root_id} .dmr-evidence-label { display: block; }
    #${root_id} .dmr-snapshot { margin-top: 14px; font-size: .86em; }
    #${root_id} [hidden] { display: none; }
    @keyframes ${root_id}-arrive {
      from { opacity: .35; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      #${root_id}:hover { transform: translateY(-1px); box-shadow: 0 4px 16px color-mix(in srgb, var(--dmr-text) 5%, transparent); }
    }
    @media (max-width: 420px) {
      #${root_id} { padding: 14px; }
      #${root_id} .dmr-values { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #${root_id} { animation: none; transition: none; transform: none; }
    }
  </style>
  <header class="dmr-heading">
    <div class="dmr-brand">
      <span class="dmr-dot" aria-hidden="true"></span>
      <strong>${routing_label}</strong>
      <span class="dmr-scope">${scope_label}</span>
    </div>
    <span class="dmr-badge">${status_label}</span>
  </header>
  <dl class="dmr-values">
    <div><dt>${model_label}</dt><dd><code>${model_value}</code></dd></div>
    <div><dt>${effort_label}</dt><dd><code>${effort_value}</code></dd></div>
  </dl>
  <p class="dmr-reason" ${reason_hidden}>${reason}</p>
  <p class="dmr-evidence" ${evidence_hidden}><span class="dmr-evidence-label">${evidence_label}</span>${evidence}</p>
  <p class="dmr-snapshot">${snapshot_label}</p>
</section>
